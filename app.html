<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AskFSKTM – Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F9; --panel:#FFFFFF; --card:#FFFBF4; --line:#E5E0EF; --line2:#EFEBF6;
  --ink:#2E2650; --ink2:#5F5880; --ink3:#8D88A6;
  --purple:#6B5BA8; --purple-d:#4B3F72; --lilac:#AC9FC8; --lilac-l:#ECE7F8;
  --mint:#D6EFE2; --mint-d:#2F7D5B; --peach:#FBE1CD; --peach-d:#B4612A;
  --butter:#FCF0C6; --butter-d:#8E6B0E; --pink:#F8DCE7; --pink-d:#A93E6A;
  --red:#C2415B;
  --r:18px; --shadow:0 8px 24px rgba(75,63,114,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-family:'Fredoka',sans-serif;color:var(--purple-d);font-weight:600;line-height:1.15}

/* ---------- layout ---------- */
.top{height:64px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font:700 22px 'Fredoka';color:var(--purple-d);white-space:nowrap}
.logo .mark{width:34px;height:34px;border-radius:11px;background:var(--purple);display:grid;place-items:center;color:#fff}
.logo span{color:var(--lilac)}
.rolebar{margin-left:auto;display:flex;align-items:center;gap:8px}
.rolebar small{color:var(--ink3);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:1px}
.seg{display:flex;background:var(--lilac-l);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:800;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--purple);color:#fff}
.me{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 14px 'Fredoka';flex:none}
.me div{font-size:13px;line-height:1.2}
.me b{display:block;font-size:14px}

.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.nav{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:12px;font-weight:700;color:var(--ink2);width:100%}
.nav:hover{background:var(--line2)}
.nav.on{background:var(--lilac-l);color:var(--purple-d)}
.nav .cnt{margin-left:auto;background:var(--purple);color:#fff;font-size:11px;border-radius:999px;padding:1px 8px}
.side .sep{height:1px;background:var(--line);margin:12px 6px}
.side .help{margin-top:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:12.5px;color:var(--ink2);line-height:1.45}
.side .help b{color:var(--purple-d)}
.main{padding:24px 28px 60px;min-width:0}

/* ---------- common ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{font-size:30px}
.ph p{color:var(--ink2);margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;background:var(--purple);color:#fff;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--purple-d)}
.btn.ghost{background:var(--panel);color:var(--purple-d);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line2)}
.btn.soft{background:var(--lilac-l);color:var(--purple-d)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.green{background:var(--mint-d)} .btn.red{background:var(--red)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.p-purple{background:var(--lilac-l);color:var(--purple-d)} .p-mint{background:var(--mint);color:var(--mint-d)}
.p-peach{background:var(--peach);color:var(--peach-d)} .p-butter{background:var(--butter);color:var(--butter-d)}
.p-pink{background:var(--pink);color:var(--pink-d)} .p-grey{background:#EEECF3;color:var(--ink2)}
.muted{color:var(--ink3)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{padding:16px 18px}
.stat .v{font:700 30px 'Fredoka';color:var(--purple-d);margin-top:4px}
.stat .l{font-size:13px;color:var(--ink2);font-weight:700}
.stat .d{font-size:12px;font-weight:800;margin-top:4px}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;outline:none}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--lilac);box-shadow:0 0 0 3px var(--lilac-l)}
label.f{display:block;font-weight:800;font-size:13px;color:var(--ink2);margin:14px 0 6px}
.ico{width:18px;height:18px;flex:none}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line2);font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:0}

/* ---------- question cards ---------- */
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar select{width:auto;min-width:230px;font-weight:700}
.toolbar .search{flex:1;min-width:200px;position:relative}
.toolbar .search input{padding-left:38px}
.toolbar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.q{padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:transform .15s}
.q:hover{transform:translateY(-2px)}
.q h3{font-size:18px;color:var(--ink);margin:8px 0 6px}
.q .ans{background:var(--mint);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px;color:var(--ink)}
.q .ans b{color:var(--mint-d)}
.q .foot{display:flex;gap:14px;margin-top:10px;font-size:13px;color:var(--ink3);font-weight:700;align-items:center}

/* ---------- chatbot ---------- */
.bot{position:sticky;top:84px;display:flex;flex-direction:column;height:calc(100vh - 110px);max-height:680px;overflow:hidden}
.bot-h{background:var(--purple);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.bot-h h4{color:#fff;font-size:17px}
.bot-h small{opacity:.8;font-size:12px}
.bot-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#FCFBFF}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.45}
.msg.u{align-self:flex-end;background:var(--lilac-l);border-bottom-right-radius:5px}
.msg.b{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.msg .src{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:12px;font-weight:800;color:var(--mint-d);background:var(--mint);border-radius:8px;padding:5px 8px}
.msg .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.bot-f{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;background:#fff}
.bot-f select{width:auto;font-size:12px;padding:8px}
.bot-f input{flex:1}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--lilac);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(46,38,80,.35);display:grid;place-items:center;z-index:50;padding:16px}
.modal{width:min(640px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:22px 24px;box-shadow:0 30px 80px rgba(46,38,80,.3)}
.modal h2{font-size:24px}
.modal .x{float:right;border:0;background:var(--line2);border-radius:10px;width:34px;height:34px;font-size:18px}
.toggle{display:flex;align-items:center;gap:12px;background:var(--lilac-l);border-radius:14px;padding:12px 14px;margin-top:14px}
.sw{width:44px;height:26px;border-radius:999px;background:#CFC8E0;position:relative;border:0;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--purple)}.sw.on::after{left:21px}
.dupe{border:1px dashed var(--lilac);background:#FCFBFF;border-radius:14px;padding:12px;margin-top:12px}
.dupe .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line2)}
.dupe .it:first-of-type{border-top:0}
.aitag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--purple)}

/* ---------- lecturer ---------- */
.cl{padding:16px 18px;margin-bottom:12px;display:grid;grid-template-columns:62px 1fr auto;gap:16px;align-items:center;cursor:pointer}
.cl:hover{border-color:var(--lilac)}
.cl .n{width:62px;height:62px;border-radius:16px;background:var(--lilac-l);display:grid;place-items:center;text-align:center;font:700 22px 'Fredoka';color:var(--purple-d);line-height:1}
.cl .n small{display:block;font:800 10px 'Nunito';color:var(--ink2);margin-top:3px}
.cl h3{font-size:17px;color:var(--ink);margin:6px 0 4px}
.cl p{font-size:13.5px;color:var(--ink2)}
.cl.done{opacity:.6}
.sum{background:var(--butter);border-radius:14px;padding:12px 14px;font-size:14px;margin:12px 0}
.sum b{color:var(--butter-d)}
.member{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line2);font-size:14px}
.member:first-child{border-top:0}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.slot{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px}
.slot.on{background:var(--purple);border-color:var(--purple);color:#fff}
.slot.taken{background:#F2F0F6;color:var(--ink3);text-decoration:line-through;cursor:not-allowed}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;font-weight:700;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--purple)}

.week{display:grid;grid-template-columns:90px repeat(5,1fr);gap:6px}
.week .h{font-weight:800;font-size:12px;color:var(--ink3);text-align:center;padding:6px 0;text-transform:uppercase}
.week .t{font-size:12px;font-weight:800;color:var(--ink2);display:flex;align-items:center}
.week button{border:1px solid var(--line);background:#fff;border-radius:10px;height:38px;font-size:12px;font-weight:800;color:var(--ink3)}
.week button.on{background:var(--mint);border-color:#B5DEC9;color:var(--mint-d)}
.week button.bk{background:var(--peach);border-color:#F2C6A6;color:var(--peach-d)}

.bars{display:flex;align-items:flex-end;gap:12px;height:150px;padding:10px 4px 0}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ink3)}
.bars span{width:100%;border-radius:8px 8px 4px 4px;background:var(--lilac)}
.bars span.b2{background:var(--mint-d)}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:var(--purple-d);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:0 14px 30px rgba(46,38,80,.3);opacity:0;transition:.3s;z-index:60;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.empty{padding:30px;text-align:center;color:var(--ink3)}
.back{border:0;background:transparent;color:var(--purple);font-weight:800;margin-bottom:10px;display:inline-flex;gap:6px;align-items:center}

@media (max-width:1100px){.grid2{grid-template-columns:1fr}.bot{position:static;height:520px}.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .side .sep,.side .help{display:none}
  .nav{white-space:nowrap;width:auto}
  .me div{display:none}
  .rolebar small{display:none}
  .logo{font-size:0}.logo .mark{font-size:14px}
  .main{padding:18px 14px 60px}
  .top a.btn{display:none}
  .cl{grid-template-columns:50px 1fr}.cl .n{width:50px;height:50px;font-size:18px}.cl>div:last-child{grid-column:1/-1}
  .week{grid-template-columns:60px repeat(5,1fr)}
}
</style>
</head>

 if(pinned) return{t:`${pinned.c.answer}`,src:`Official answer by ${pinned.c.by} (pinned)`};
 const hit=KB.map(k=>({k,n:w.filter(x=>k.k.includes(x)).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n)[0];

function aiDraft(c){
 const d={1:'Hi everyone, yes, you may change group members until the end of Week 5 if a member has dropped the course. Please email me the updated group list with all members cc\'d. Swapping between groups is not allowed after Week 5.',
  2:'Hi all, the use case diagram is required in the proposal (Section 4: Proposed System). Keep it high level, with 1 diagram covering the main actors. Detailed UML (activity/sequence) only comes in the final report.',

 return d[c.id]||`Hi everyone, thanks for your question about "${c.title}". Here's the answer: [edit this draft]. Let me know during consultation hours if anything is still unclear.`;
}

VIEWS.admin.tickets=()=>{
 const flow=['New','In progress','Waiting on user','Resolved','Closed'],col={New:'p-pink','In progress':'p-peach','Waiting on user':'p-butter',Resolved:'p-mint',Closed:'p-grey'};
 after=()=>document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const t=S.tickets.find(x=>x.id===b.dataset.t);const i=flow.indexOf(t.st);t.st=flow[Math.min(i+1,flow.length-1)];toast(`${t.id} → ${t.st}${t.st==='Resolved'?' · user notified':''}`);render();});
 return `<div class="ph"><div><h1>Support Tickets</h1><p>Technical issues reported by students and lecturers. Click <b>Next stage</b> to move a ticket along.</p></div></div>
 <div class="card" style="overflow-x:auto"><table><tr><th>ID</th><th>Subject</th><th>From</th><th>Priority</th><th>Status</th><th>Age</th><th></th></tr>
 ${S.tickets.map(t=>`<tr><td><b>${t.id}</b></td><td>${t.sub}</td><td>${t.from}</td><td><span class="pill ${t.pri==='High'?'p-pink':t.pri==='Medium'?'p-butter':'p-grey'}">${t.pri}</span></td><td><span class="pill ${col[t.st]}">${t.st}</span></td><td class="muted">${t.age}</td><td>${t.st!=='Closed'?`<button class="btn sm ghost" data-t="${t.id}">Next stage</button>`:''}</td></tr>`).join('')}</table></div>`;
};
VIEWS.admin.mod=()=>{
 after=()=>document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const[a,id]=b.dataset.m.split(':'),h=S.held.find(x=>x.id==id);
  if(a==='rev'){if(confirm('Reveal this student\'s identity? This action is logged and only allowed for abuse cases.')){h.shown=true;render();}return;}
  S.held=S.held.filter(x=>x!==h);
  if(a==='ok'){S.clusters.unshift({id:++uid,course:h.course,cat:guessCat(h.t),title:h.t,members:[{who:'Student',t:h.t}],extra:0,age:'just now',votes:1,summary:'1 student asks: "'+h.t+'"',status:'open',for:'Any lecturer'});toast('Approved and published.');}
  else toast('Rejected. The student has been notified.');render();});
 return `<div class="ph"><div><h1>Moderation</h1><p>Posts the AI held for review. Students stay anonymous unless an abuse case requires it.</p></div></div>
 ${S.held.map(h=>`<div class="card pad" style="margin-bottom:12px"><div class="row"><span class="pill p-purple">${cname(h.course)}</span><span class="pill p-pink">${ic('shield',13)}${h.reason}</span></div>
  <p style="margin:10px 0;font-size:16px">"${esc(h.t)}"</p><div class="muted small">Posted by: <b>${h.shown?h.real+' (revealed · logged)':h.who}</b></div>
  <div class="row" style="margin-top:12px"><button class="btn sm green" data-m="ok:${h.id}">${ic('check',14)}Approve</button><button class="btn sm red" data-m="no:${h.id}">Reject</button>${h.shown?'':`<button class="btn sm ghost" data-m="rev:${h.id}">${ic('eye',14)}Reveal identity</button>`}</div></div>`).join('')||'<div class="card empty">Nothing to review. 🎉</div>'}`;
};
